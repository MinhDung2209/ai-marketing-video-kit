<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<title>Video marketing</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/*FONTS*/
body{margin:0;background:var(--bg,#0B1020);color:#fff;font-family:var(--font-sub,'IBM Plex Sans',sans-serif)}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg,#0B1020)}
.clip{position:absolute;inset:0;overflow:hidden}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.h{font-family:var(--font-title,'Be Vietnam Pro',sans-serif);font-weight:800;letter-spacing:-1px;line-height:1.08;margin:0}
.headline{position:absolute;left:70px;right:70px}
.hl{color:var(--hl,__HL__)}
.shade-top{position:absolute;left:0;right:0;top:0;height:1000px;background:linear-gradient(180deg,rgba(6,9,20,.92) 0%,rgba(6,9,20,.5) 55%,rgba(6,9,20,0) 100%)}
.chips{position:absolute;left:80px;right:80px;top:520px;display:flex;flex-direction:column;gap:26px}
.chip{position:relative;align-self:flex-start;font-family:var(--font-title,'Be Vietnam Pro',sans-serif);font-weight:800;font-size:58px;padding:14px 34px;border-radius:20px;background:rgba(15,18,32,.85);border:2px solid rgba(255,255,255,.2);opacity:0}
.strike{position:absolute;left:18px;right:18px;top:50%;height:10px;border-radius:6px;background:#EF4444;transform-origin:left center;transform:scaleX(0)}
.shot{position:absolute;border-radius:28px;overflow:hidden;border:2px solid rgba(255,255,255,.14);box-shadow:0 40px 120px rgba(0,0,0,.6)}
.shot img{display:block;width:100%;height:auto}
.tag{position:absolute;font-family:var(--font-title,'Be Vietnam Pro',sans-serif);font-weight:700;font-size:26px;letter-spacing:2px;padding:10px 20px;border-radius:999px;background:var(--accent,__ACCENT__);color:#fff}
.brand{display:flex;align-items:center;justify-content:center;gap:30px}
.brand img{width:170px;height:170px;border-radius:36px;object-fit:cover}
.brand .name{font-family:var(--font-title,'Be Vietnam Pro',sans-serif);font-weight:800;font-size:120px;letter-spacing:-2px}
.sub{position:absolute;left:60px;right:60px;text-align:center;font-family:var(--font-title,'Be Vietnam Pro',sans-serif);font-weight:700;font-size:48px;color:#A5B4FC}
.cta{position:absolute;left:90px;right:90px;display:flex;align-items:center;justify-content:center;height:140px;border-radius:32px;background:var(--accent,__ACCENT__);font-family:var(--font-title,'Be Vietnam Pro',sans-serif);font-weight:800;font-size:52px;color:#fff}
.cap{position:absolute;inset:auto;left:60px;right:calc(var(--safe-right,140px) + 60px);bottom:calc(var(--safe-bottom,420px) + 16px);top:__CAPTOP__;display:flex;justify-content:center;align-items:flex-start}
.cap span{display:block;text-align:center;font-family:var(--font-title,'Be Vietnam Pro',sans-serif);font-weight:700;font-size:44px;line-height:1.3;padding:14px 28px;border-radius:20px;background:rgba(11,16,32,.85);color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.5);text-shadow:0 2px 8px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-layout="__LAYOUT__" data-start="0" data-width="__W__" data-height="__H__" data-duration="__D__">
__SECTIONS__
__CAPTIONS__
</div>
<script>
const tl = gsap.timeline({ paused: true }); const E = "power3.out";
__JS__
document.querySelectorAll(".cap").forEach(c => tl.fromTo(c.querySelector("span"),{y:24,opacity:0},{y:0,opacity:1,duration:0.22,ease:E},parseFloat(c.dataset.start)));
window.__timelines["main"] = tl;
</script>
</body>
</html>
