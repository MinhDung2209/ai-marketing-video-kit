<!-- card_stack.html: Motion Insert — Staggered Card Stack -->
<div class="insert-clip" id="{{id}}" data-start="{{t}}" data-duration="{{dur}}">
  <div class="insert-panel {{panel_class}}">
    <div class="ins-stack">
      <div class="ins-stack-header">
        {{kicker_html}}
        <div class="ins-title">{{title}}</div>
        {{sub_html}}
      </div>
      <div class="ins-stack-cards">
        {{cards_html}}
      </div>
    </div>
  </div>
</div>
<script>
tl.fromTo('#{{id}} .insert-panel', { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: 'power3.out', immediateRender: false }, {{t}});
tl.fromTo('#{{id}} .ins-stack-header', { y: -16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power3.out', immediateRender: false }, {{t}} + 0.08);
{{cards_anim}}
tl.to('#{{id}} .insert-panel', { opacity: 0, scale: 0.96, duration: 0.22, ease: 'power2.in', immediateRender: false }, {{t}} + {{dur}} - 0.22);
</script>
