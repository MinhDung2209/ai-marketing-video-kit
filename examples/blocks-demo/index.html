<script>
const standalonePreview = !window.__timelines;
const tl = gsap.timeline({ paused: true }); const E = "power3.out";
tl.fromTo('#flow0-title',{y:18,opacity:0},{y:0,opacity:1,duration:0.3,ease:'power3.out',immediateRender:false},0.050);
tl.fromTo('#flow0-node0',{y:28,opacity:0},{y:0,opacity:1,duration:0.38,ease:'power3.out',immediateRender:false},0.300);

tl.fromTo('#rehook1-rule',{scaleX:0},{scaleX:1,duration:0.4,ease:'power3.out',immediateRender:false},6.000);
tl.fromTo('#rehook1-metric',{clipPath:'inset(0 100% 0 0)',x:-32,opacity:0},{clipPath:'inset(0 0% 0 0)',x:0,opacity:1,duration:0.42,ease:'power3.out',immediateRender:false},7.800);
tl.fromTo('#rehook1-echo',{x:-30,y:24,opacity:0},{x:16,y:16,opacity:.65,duration:0.3,ease:'power3.out',immediateRender:false},9.600);
tl.fromTo('#rehook1-front',{clipPath:'inset(0 100% 0 0)',x:-32,opacity:0},{clipPath:'inset(0 0% 0 0)',x:0,opacity:1,duration:0.42,ease:'power3.out',immediateRender:false},9.660);
tl.fromTo('#rehook1-echo',{x:16,y:16,opacity:.65},{x:8,y:8,opacity:.25,duration:0.3,ease:'power3.out',immediateRender:false},9.920);
document.querySelectorAll(".cap").forEach(c => tl.fromTo(c.querySelector("span"),{y:24,opacity:0},{y:0,opacity:1,duration:0.22,ease:E},parseFloat(c.dataset.start)));
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;

function previewAt(t) {
  tl.seek(t, false);
  document.querySelectorAll('section[data-start]').forEach(el => {
    const s = +el.dataset.start, d = +el.dataset.duration;
    el.style.visibility = t >= s && t < s + d ? 'visible' : 'hidden';
  });
}
if (standalonePreview) {
  let position = Number(new URLSearchParams(location.search).get('t') || 4.8);
  document.fonts.ready.then(() => previewAt(position));
  document.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    position = Math.max(0, Math.min(+document.getElementById('root').dataset.duration - .01,
      position + (e.key === 'ArrowRight' ? .1 : -.1)));
    previewAt(position);
  });
}
